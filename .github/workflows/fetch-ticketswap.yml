name: Fetch TicketSwap Data

on:
  schedule:
    - cron: "0 8,13,18,0 * * *"
  workflow_dispatch:

jobs:
  fetch-ticketswap:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Fetch TicketSwap listings and prices
        run: npm run fetch-ticketswap
        env:
          ZYTE_API_KEY: ${{ secrets.ZYTE_API_KEY }}
          RESURRECTION_API_KEY: ${{ secrets.RESURRECTION_API_KEY }}
