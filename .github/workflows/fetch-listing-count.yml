name: Fetch TicketSwap Listing Count

on:
  schedule:
    # Runs 4 times per day at 10 AM, 3 PM, 8 PM, and midnight UTC (offset from fetch-prices)
    - cron: "0 10,15,20,0 * * *"
  workflow_dispatch: # Allow manual trigger

jobs:
  fetch-listing-count:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install system dependencies for Puppeteer
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 \
            libnspr4 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libdrm2 \
            libxkbcommon0 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxrandr2 \
            libgbm1 \
            libpango-1.0-0 \
            libcairo2 \
            libasound2t64

      - name: Install dependencies
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"

      - name: Install Puppeteer Chrome
        run: npx puppeteer browsers install chrome

      - name: Fetch listing count
        run: npm run fetch-listing-count
        env:
          API_URL: https://resurrection-tracker.vercel.app/api/listings
